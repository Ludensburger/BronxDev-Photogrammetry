<ion-header class="ion-no-border">
  <img src="/assets/imgs/header1.png" id="headerimg">
  <ion-button fill="clear" (click)="onBackArrowClick()" id="backarrow">
    <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
  </ion-button>
  <ion-title id="title">Welcome</ion-title>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div id="container">
    <ion-list class="bg-transparent">
      <ion-item color="blue" lines="none">
        <ion-icon name="mail" slot="start"></ion-icon>
        <ion-input 
          id="uName" 
          type="email"
          placeholder="email@address.com"
          errorText="Invalid Email"
          ngModel
          email
          ></ion-input>
      </ion-item>
      <ion-item color="blue">
        <ion-icon name="lock-closed" slot="start"></ion-icon>
        <ion-input 
          id="pWord" 
          type="Password" 
          placeholder="*****"
          ></ion-input>
      </ion-item>
    </ion-list>
    <b style="text-align: right;">Forgot Password</b>

    <div id="buttons">
      <div class="width-limit">
        <ion-button expand="block" (click)="onLoginClick(true)" id="login-btn">Login</ion-button>
        <ion-alert
        [isOpen]="isAlertOpenFailed"
        header="Login Failed"
        message="Please Input Again"
        [buttons]="alertButtonFailed"
        (didDismiss)="onLoginClick(false)"
      ></ion-alert>
      <ion-alert
        [isOpen]="isAlertOpenSuccess"
        header="Login Success"
        message="Welcome!"
        [buttons]="alertButtonSuccess"
        (didDismiss)="onLoginClick(false)"
      ></ion-alert>
      </div>
    </div>
    
    <p style="margin-bottom: 30px;">Login Via</p>

    <div id="social-media-icons">
      <img src="/assets/imgs/apple.png" style="margin-right: 10px;">
      <img src="/assets/imgs/facebook.png" style="margin-right: 10px;">
      <img src="/assets/imgs/google.png">
    </div>
  </div>
</ion-content>
