<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu Content</ion-title>
    </ion-toolbar>
    <ion-toolbar>
      <ion-searchbar></ion-searchbar>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-menu-toggle>
      <ion-button>Click to close the menu</ion-button>
      <ion-button (click)="onSignOut()">Click to sign out</ion-button>
    </ion-menu-toggle>
  </ion-content>
</ion-menu>

<ion-header [translucent]="true">
  <div id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button>
            <ion-icon name="menu" id="menu-icon"></ion-icon>
          </ion-menu-button>
        </ion-buttons>
        <ion-title>
          <img src="assets/icon/favicon.png">
        </ion-title>
      </ion-toolbar>
    </ion-header>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-card id="card1" class="card1" (click)="onCard1Click()">
    <img src="assets/imgs/photogrampic.jpg"> <!--https://bitfab.io/blog/photogrammetry/-->
    <div class="card-title">Photogrammetry</div>
    <div class="card-subtitle">Utilize the Photogrammetry Function</div>
  </ion-card>

  <ion-card id="card2" class="card2" (click)="onCard2Click()">
    <img src="assets/imgs/takeatourpic.png"> <!--Ryan Beckford Laptop Meme-->
    <div class="card-title">Take a Tour</div>
    <div class="card-subtitle">Explore the Mobile App</div>
  </ion-card>

  <ion-card>
    <img src="assets/imgs/projectspic.jpg" (click)="onCard3Click()"> <!--https://www.linkedin.com/pulse/importance-project-development-jose-diego-monroy-cfm-->
    <div class="card-title">Check Projects</div>
    <div class="card-subtitle">See your 3D Projects</div>
  </ion-card>

</ion-content>
